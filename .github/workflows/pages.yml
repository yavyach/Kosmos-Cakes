name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site and calculators
        run: python build.py
      - name: Sync built HTML to main (GitHub Pages legacy → branch main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/cakes/*.html site/index.html site/preview.html site/catalog-init.js site/tilda-embed.html
          git add -f calculator/cakes/fixed/*.html calculator/cakes/tiered/*.html calculator/cakes/weight/*.html calculator/cakes/index.html
          if git diff --staged --quiet; then
            echo "Built HTML unchanged"
            exit 0
          fi
          git commit -m "chore: sync built HTML for Pages [skip ci]"
          git push
